<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora Cientifica Neo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --neon-cyan: #5ffbf1;
        --neon-magenta: #ff3cac;
        --neon-violet: #7845ff;
        --neon-lime: #b6ff6a;
        --neon-amber: #ffd479;
        --neon-ink: rgba(10, 16, 30, 0.85);
        --glass: rgba(15, 22, 40, 0.55);
        --glass-border: rgba(95, 251, 241, 0.35);
        --glass-shadow: rgba(0, 0, 0, 0.45);
        --panel-dark: rgba(10, 16, 30, 0.95);
        --panel-lite: rgba(30, 40, 70, 0.85);
        --text-soft: rgba(223, 240, 255, 0.72);
        --img-display: url("https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1000");
        --img-key-core: url("https://images.unsplash.com/photo-1545239351-1141bd82e8a6?q=80&w=800");
        --img-key-op: url("https://images.unsplash.com/photo-1489515217757-5fd1be406fef?q=80&w=800");
      }

      * {
        box-sizing: border-box;
        font-family: "Orbitron", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          circle at 10% 10%,
          #1b2550 0%,
          #0b0f1a 45%,
          #05060b 100%
        );
        color: #e7f7ff;
        position: relative;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: url("https://images.unsplash.com/photo-1578632292335-df3abbb0d586?q=80&w=1000")
          center/cover no-repeat;
        filter: blur(14px) saturate(1.2);
        opacity: 0.28;
        z-index: -2;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(
            circle at 80% 20%,
            rgba(120, 69, 255, 0.35),
            transparent 55%
          ),
          radial-gradient(
            circle at 20% 80%,
            rgba(95, 251, 241, 0.25),
            transparent 60%
          ),
          linear-gradient(120deg, rgba(5, 6, 11, 0.9), rgba(5, 6, 11, 0.6));
        z-index: -1;
      }

      .calc-shell {
        width: min(420px, 92vw);
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 28px;
        padding: 22px;
        backdrop-filter: blur(18px);
        box-shadow: 0 30px 60px var(--glass-shadow);
        position: relative;
      }

      .calc-shell::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 0 25px rgba(95, 251, 241, 0.2);
        pointer-events: none;
      }

      .calc-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .calc-title {
        font-size: 0.95rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--text-soft);
      }

      .drawer-toggle {
        background: transparent;
        border: 1px solid rgba(95, 251, 241, 0.4);
        color: var(--neon-cyan);
        font-size: 0.7rem;
        letter-spacing: 0.2em;
        padding: 8px 12px;
        border-radius: 999px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .drawer-toggle:hover {
        box-shadow: 0 0 16px rgba(95, 251, 241, 0.45);
      }

      .display {
        position: relative;
        background: linear-gradient(145deg, var(--panel-dark), var(--panel-lite));
        border-radius: 20px;
        padding: 18px;
        min-height: 130px;
        overflow: hidden;
        border: 1px solid rgba(95, 251, 241, 0.25);
        box-shadow: inset 0 0 18px rgba(95, 251, 241, 0.2);
        isolation: isolate;
      }

      .display__art {
        position: absolute;
        inset: 0;
        background: var(--img-display) center/cover no-repeat;
        opacity: 0.14;
        filter: saturate(1.3);
        mix-blend-mode: screen;
        z-index: 0;
        pointer-events: none;
      }

      .display::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: linear-gradient(
            rgba(95, 251, 241, 0.1) 1px,
            transparent 1px
          ),
          linear-gradient(90deg, rgba(95, 251, 241, 0.08) 1px, transparent 1px);
        background-size: 24px 24px;
        opacity: 0.35;
        pointer-events: none;
        z-index: 1;
      }

      .display::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.05),
          rgba(255, 255, 255, 0.05) 1px,
          transparent 1px,
          transparent 4px
        );
        opacity: 0.4;
        pointer-events: none;
        animation: scan 5s linear infinite;
        z-index: 1;
      }

      @keyframes scan {
        0% {
          transform: translateY(-20%);
        }
        100% {
          transform: translateY(20%);
        }
      }

      .display__flash {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 20% 20%,
          rgba(95, 251, 241, 0.4),
          transparent 60%
        );
        opacity: 0;
        pointer-events: none;
        z-index: 2;
      }

      .display.flash .display__flash {
        animation: flash 0.18s ease-out;
      }

      @keyframes flash {
        0% {
          opacity: 0.6;
        }
        100% {
          opacity: 0;
        }
      }

      .display__expression {
        position: absolute;
        top: 14px;
        right: 16px;
        left: 16px;
        z-index: 3;
        text-align: right;
        font-size: 0.9rem;
        color: var(--text-soft);
        min-height: 1.4rem;
        letter-spacing: 0.08em;
      }

      .display__result {
        position: absolute;
        bottom: 14px;
        left: 16px;
        right: 16px;
        z-index: 3;
        text-align: left;
        font-size: 2rem;
        font-weight: 700;
        color: var(--neon-amber);
        text-shadow: 0 0 16px rgba(255, 212, 121, 0.6);
        word-break: break-word;
      }

      .keys {
        margin-top: 18px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
      }

      .key {
        --key-img: var(--img-key-core);
        height: 56px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: linear-gradient(160deg, #1b2238, #0b101d);
        color: #e9f6ff;
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        text-shadow: 0 0 10px rgba(95, 251, 241, 0.45),
          0 2px 4px rgba(0, 0, 0, 0.6);
        transition: transform 0.08s ease, box-shadow 0.2s ease,
          border 0.2s ease;
        box-shadow: inset -3px -3px 10px rgba(0, 0, 0, 0.4),
          inset 2px 2px 6px rgba(255, 255, 255, 0.08);
      }

      .key::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: var(--key-img);
        background-position: center;
        background-repeat: no-repeat;
        background-size: 85%;
        opacity: 0.42;
        filter: saturate(1.15) contrast(1.1);
        mix-blend-mode: screen;
        pointer-events: none;
      }

      .key::after {
        content: "";
        position: absolute;
        inset: 4px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        pointer-events: none;
      }

      .key:hover {
        border-color: rgba(95, 251, 241, 0.5);
        box-shadow: 0 0 18px rgba(95, 251, 241, 0.35);
      }

      .key:active {
        transform: translateY(2px) scale(0.98);
        box-shadow: inset 2px 2px 6px rgba(0, 0, 0, 0.45);
      }

      .key--op {
        --key-img: var(--img-key-op);
        color: var(--neon-cyan);
      }

      .key--accent {
        --key-img: var(--img-key-op);
        color: var(--neon-magenta);
      }

      .key--equal {
        grid-column: span 2;
        --key-img: var(--img-key-op);
        background: linear-gradient(140deg, #4a1f85, #1a102e);
        color: #fff;
        text-shadow: 0 0 10px rgba(255, 60, 172, 0.7);
      }

      .key--clear {
        --key-img: var(--img-key-op);
        background: linear-gradient(140deg, #8b1f2a, #2b0f14);
        color: #ffd6d6;
      }

      .drawer {
        position: absolute;
        top: 50%;
        right: -10px;
        transform: translate(100%, -50%);
        width: 220px;
        background: rgba(9, 13, 24, 0.9);
        border: 1px solid rgba(120, 69, 255, 0.5);
        border-radius: 20px;
        padding: 16px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
        opacity: 0;
        pointer-events: none;
        transition: all 0.25s ease;
        max-height: 320px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .drawer.open {
        transform: translate(0%, -50%);
        opacity: 1;
        pointer-events: auto;
      }

      .drawer__title {
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        color: var(--neon-violet);
      }

      .history {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
      }

      .history li {
        font-size: 0.7rem;
        color: var(--text-soft);
        border-left: 2px solid rgba(95, 251, 241, 0.4);
        padding-left: 8px;
        line-height: 1.4;
      }

      .footer-note {
        margin-top: 14px;
        text-align: center;
        font-size: 0.7rem;
        letter-spacing: 0.12em;
        color: rgba(223, 240, 255, 0.55);
      }
    </style>
  </head>
  <body>
    <div class="calc-shell" id="calcApp">
      <div class="calc-header">
        <div class="calc-title">Ciencia Mecha v3.1</div>
        <button class="drawer-toggle" id="toggleHistory">Historial</button>
      </div>

      <div class="display" id="display">
        <div class="display__art"></div>
        <div class="display__flash"></div>
        <div class="display__expression" id="displayExpression"></div>
        <div class="display__result" id="displayResult">0</div>
      </div>

      <div class="keys" id="keypad">
        <button class="key key--clear" data-action="clear">C</button>
        <button class="key key--accent" data-action="backspace">DEL</button>
        <button class="key key--op" data-action="paren" data-value="(">(</button>
        <button class="key key--op" data-action="paren" data-value=")">)</button>
        <button class="key key--op" data-action="op" data-value="/">÷</button>

        <button class="key key--op" data-action="func" data-value="sin">sin</button>
        <button class="key key--op" data-action="func" data-value="cos">cos</button>
        <button class="key key--op" data-action="func" data-value="tan">tan</button>
        <button class="key key--op" data-action="func" data-value="log">log10</button>
        <button class="key key--op" data-action="func" data-value="sqrt">√</button>

        <button class="key key--op" data-action="func" data-value="ln">ln</button>
        <button class="key key--op" data-action="func" data-value="log2">log2</button>
        <button class="key key--op" data-action="func" data-value="recip">1/x</button>
        <button class="key key--op" data-action="fraction">a/b</button>
        <button class="key key--op" data-action="func" data-value="abs">abs</button>

        <button class="key" data-action="digit" data-value="7">7</button>
        <button class="key" data-action="digit" data-value="8">8</button>
        <button class="key" data-action="digit" data-value="9">9</button>
        <button class="key key--op" data-action="op" data-value="*">×</button>
        <button class="key key--op" data-action="op" data-value="^">x^y</button>

        <button class="key" data-action="digit" data-value="4">4</button>
        <button class="key" data-action="digit" data-value="5">5</button>
        <button class="key" data-action="digit" data-value="6">6</button>
        <button class="key key--op" data-action="op" data-value="-">−</button>
        <button class="key key--op" data-action="const" data-value="pi">π</button>

        <button class="key" data-action="digit" data-value="1">1</button>
        <button class="key" data-action="digit" data-value="2">2</button>
        <button class="key" data-action="digit" data-value="3">3</button>
        <button class="key key--op" data-action="op" data-value="+">+</button>
        <button class="key key--op" data-action="const" data-value="e">e</button>

        <button class="key" data-action="digit" data-value="0">0</button>
        <button class="key" data-action="dot">.</button>
        <button class="key key--equal" data-action="equals">=</button>
      </div>

      <div class="footer-note">HUD Neural / Modo Operativo Seguro</div>

      <aside class="drawer" id="historyDrawer">
        <div class="drawer__title">ULTIMOS 10</div>
        <ol class="history" id="historyList"></ol>
      </aside>
    </div>

    <script>
      class CalculatorEngine {
        constructor() {
          this.tokens = [];
          this.currentInput = "";
          this.lastResult = "0";
          this.justEvaluated = false;
          this.error = false;
          this.functions = [
            "sin",
            "cos",
            "tan",
            "log",
            "sqrt",
            "ln",
            "log2",
            "recip",
            "abs",
          ];
        }

        clear() {
          this.tokens = [];
          this.currentInput = "";
          this.lastResult = "0";
          this.justEvaluated = false;
          this.error = false;
        }

        backspace() {
          if (this.error) {
            this.clear();
            return;
          }
          if (this.currentInput) {
            this.currentInput = this.currentInput.slice(0, -1);
            return;
          }
          const removed = this.tokens.pop();
          if (removed === "(" && this._isFunction(this.tokens.at(-1))) {
            this.tokens.pop();
          }
        }

        inputDigit(digit) {
          this._prepareForInput(true);
          this.currentInput += digit;
        }

        inputDot() {
          this._prepareForInput(true);
          if (!this.currentInput.includes(".")) {
            this.currentInput = this.currentInput ? this.currentInput + "." : "0.";
          }
        }

        inputOperator(op) {
          this._prepareForInput(false);
          if (!this.currentInput && this.tokens.length === 0 && op === "-") {
            this.currentInput = "-";
            return;
          }
          if (!this.currentInput && this._isOperator(this.tokens.at(-1))) {
            this.tokens[this.tokens.length - 1] = op;
            return;
          }
          this._flushCurrent();
          if (this.tokens.length === 0) {
            this.tokens.push("0");
          }
          this.tokens.push(op);
        }

        inputFunction(fn) {
          this._prepareForInput(true);
          this._insertImplicitMultiply();
          this.tokens.push(fn, "(");
        }

        inputConstant(constant) {
          this._prepareForInput(true);
          this._insertImplicitMultiply();
          this.tokens.push(constant);
        }

        inputParen(paren) {
          this._prepareForInput(true);
          if (paren === "(") {
            this._insertImplicitMultiply();
            this.tokens.push(paren);
            return;
          }
          this._flushCurrent();
          this.tokens.push(paren);
        }

        inputFraction() {
          this._prepareForInput(false);
          if (!this.currentInput && this.tokens.length === 0) {
            this.tokens.push("0");
          }
          if (!this.currentInput && this._isOperator(this.tokens.at(-1))) {
            this.tokens[this.tokens.length - 1] = "/";
            return;
          }
          this._flushCurrent();
          this.tokens.push("/");
        }

        evaluate() {
          if (this.error) {
            this.clear();
            return { ok: false, result: "Error", expression: [] };
          }
          this._flushCurrent();
          if (this.tokens.length === 0) {
            return { ok: false, result: this.lastResult, expression: [] };
          }
          const expressionSnapshot = [...this.tokens];
          const rpn = this._toRpn(expressionSnapshot);
          if (!rpn) {
            this._setError();
            return { ok: false, result: "Error", expression: expressionSnapshot };
          }
          const value = this._evaluateRpn(rpn);
          if (value === null || Number.isNaN(value) || !Number.isFinite(value)) {
            this._setError();
            return { ok: false, result: "Error", expression: expressionSnapshot };
          }
          this.lastResult = this._formatNumber(value);
          this.tokens = [this.lastResult];
          this.justEvaluated = true;
          return { ok: true, result: this.lastResult, expression: expressionSnapshot };
        }

        getTokensWithCurrent() {
          const tokens = [...this.tokens];
          if (this.currentInput) {
            tokens.push(this.currentInput);
          }
          return tokens;
        }

        getDisplayValue() {
          if (this.error) return "Error";
          if (this.currentInput) return this.currentInput;
          const last = this.tokens.at(-1);
          if (this._isNumberToken(last)) return last;
          if (last === "pi") return this._formatNumber(Math.PI);
          if (last === "e") return this._formatNumber(Math.E);
          if (this.justEvaluated) return this.lastResult;
          return "0";
        }

        _prepareForInput(startNew) {
          if (this.error) {
            this.clear();
          }
          if (this.justEvaluated) {
            if (startNew) {
              this.tokens = [];
              this.currentInput = "";
            }
            this.justEvaluated = false;
          }
        }

        _flushCurrent() {
          if (this.currentInput) {
            this.tokens.push(this.currentInput);
            this.currentInput = "";
          }
        }

        _insertImplicitMultiply() {
          const last = this.currentInput || this.tokens.at(-1);
          if (
            last &&
            (this._isNumberToken(last) ||
              last === "pi" ||
              last === "e" ||
              last === ")")
          ) {
            this._flushCurrent();
            if (!this._isOperator(this.tokens.at(-1))) {
              this.tokens.push("*");
            }
          }
        }

        _isOperator(token) {
          return ["+", "-", "*", "/", "^"].includes(token);
        }

        _isFunction(token) {
          return this.functions.includes(token);
        }

        _isNumberToken(token) {
          return typeof token === "string" && /^-?\d+(\.\d+)?$/.test(token);
        }

        _setError() {
          this.error = true;
          this.tokens = [];
          this.currentInput = "";
          this.lastResult = "Error";
          this.justEvaluated = false;
        }

        _formatNumber(value) {
          if (Number.isInteger(value)) return String(value);
          const trimmed = Number(value.toPrecision(12));
          return String(trimmed);
        }

        _toRpn(tokens) {
          const output = [];
          const stack = [];
          const operators = {
            "+": { prec: 1, assoc: "L" },
            "-": { prec: 1, assoc: "L" },
            "*": { prec: 2, assoc: "L" },
            "/": { prec: 2, assoc: "L" },
            "^": { prec: 3, assoc: "R" },
            "u-": { prec: 4, assoc: "R" },
          };
          let prevToken = null;
          for (const token of tokens) {
            if (this._isNumberToken(token)) {
              output.push(token);
              prevToken = "number";
              continue;
            }
            if (token === "pi" || token === "e") {
              output.push(token);
              prevToken = "number";
              continue;
            }
            if (this._isFunction(token)) {
              stack.push(token);
              prevToken = "func";
              continue;
            }
            if (token === "(") {
              stack.push(token);
              prevToken = "(";
              continue;
            }
            if (token === ")") {
              while (stack.length && stack.at(-1) !== "(") {
                output.push(stack.pop());
              }
              if (!stack.length) return null;
              stack.pop();
              if (this._isFunction(stack.at(-1))) {
                output.push(stack.pop());
              }
              prevToken = ")";
              continue;
            }
            if (this._isOperator(token)) {
              let opToken = token;
              if (
                token === "-" &&
                (prevToken === null ||
                  prevToken === "(" ||
                  prevToken === "op" ||
                  prevToken === "func")
              ) {
                opToken = "u-";
              }
              while (stack.length) {
                const top = stack.at(-1);
                if (!operators[top]) break;
                const current = operators[opToken];
                const incoming = operators[top];
                if (
                  (current.assoc === "L" && current.prec <= incoming.prec) ||
                  (current.assoc === "R" && current.prec < incoming.prec)
                ) {
                  output.push(stack.pop());
                } else {
                  break;
                }
              }
              stack.push(opToken);
              prevToken = "op";
            }
          }
          while (stack.length) {
            const op = stack.pop();
            if (op === "(" || op === ")") return null;
            output.push(op);
          }
          return output;
        }

        _evaluateRpn(rpn) {
          const stack = [];
          for (const token of rpn) {
            if (this._isNumberToken(token)) {
              stack.push(parseFloat(token));
              continue;
            }
            if (token === "pi") {
              stack.push(Math.PI);
              continue;
            }
            if (token === "e") {
              stack.push(Math.E);
              continue;
            }
            if (token === "u-") {
              if (stack.length < 1) return null;
              stack.push(-stack.pop());
              continue;
            }
            if (this._isOperator(token)) {
              if (stack.length < 2) return null;
              const b = stack.pop();
              const a = stack.pop();
              if (token === "+") stack.push(a + b);
              if (token === "-") stack.push(a - b);
              if (token === "*") stack.push(a * b);
              if (token === "/") stack.push(b === 0 ? NaN : a / b);
              if (token === "^") stack.push(Math.pow(a, b));
              continue;
            }
            if (this._isFunction(token)) {
              if (stack.length < 1) return null;
              const value = stack.pop();
              if (token === "sin") stack.push(Math.sin(value));
              if (token === "cos") stack.push(Math.cos(value));
              if (token === "tan") stack.push(Math.tan(value));
              if (token === "log") {
                if (value <= 0) return null;
                stack.push(Math.log10(value));
              }
              if (token === "ln") {
                if (value <= 0) return null;
                stack.push(Math.log(value));
              }
              if (token === "log2") {
                if (value <= 0) return null;
                stack.push(Math.log2(value));
              }
              if (token === "sqrt") {
                if (value < 0) return null;
                stack.push(Math.sqrt(value));
              }
              if (token === "recip") {
                if (value === 0) return null;
                stack.push(1 / value);
              }
              if (token === "abs") {
                stack.push(Math.abs(value));
              }
            }
          }
          return stack.length === 1 ? stack[0] : null;
        }
      }

      class CalculatorUI {
        constructor(root) {
          this.root = root;
          this.engine = new CalculatorEngine();
          this.display = root.querySelector("#display");
          this.expressionEl = root.querySelector("#displayExpression");
          this.resultEl = root.querySelector("#displayResult");
          this.historyList = root.querySelector("#historyList");
          this.drawer = root.querySelector("#historyDrawer");
          this.toggleButton = root.querySelector("#toggleHistory");
          this.history = [];
          this.lastExpressionTokens = [];
          this._bindEvents();
          this.render();
        }

        _bindEvents() {
          const keypad = this.root.querySelector("#keypad");
          keypad.addEventListener("click", (event) => {
            const key = event.target.closest("button[data-action]");
            if (!key) return;
            const action = key.dataset.action;
            const value = key.dataset.value;
            if (action === "digit") this.engine.inputDigit(value);
            if (action === "dot") this.engine.inputDot();
            if (action === "op") this.engine.inputOperator(value);
            if (action === "func") this.engine.inputFunction(value);
            if (action === "const") this.engine.inputConstant(value);
            if (action === "paren") this.engine.inputParen(value);
            if (action === "fraction") this.engine.inputFraction();
            if (action === "clear") {
              this.engine.clear();
              this.lastExpressionTokens = [];
            }
            if (action === "backspace") this.engine.backspace();
            if (action === "equals") {
              const result = this.engine.evaluate();
              if (result.ok) {
                this.lastExpressionTokens = result.expression;
                this._addHistory(result.expression, result.result);
              }
            }
            this._flashDisplay();
            this.render();
          });

          this.toggleButton.addEventListener("click", () => {
            this.drawer.classList.toggle("open");
          });
        }

        _flashDisplay() {
          this.display.classList.remove("flash");
          void this.display.offsetWidth;
          this.display.classList.add("flash");
        }

        _addHistory(tokens, result) {
          const expression = this._formatExpression(tokens);
          if (!expression) return;
          this.history.unshift(`${expression} = ${result}`);
          this.history = this.history.slice(0, 10);
          this._renderHistory();
        }

        _renderHistory() {
          this.historyList.innerHTML = "";
          if (this.history.length === 0) {
            const item = document.createElement("li");
            item.textContent = "Sin registros.";
            this.historyList.appendChild(item);
            return;
          }
          this.history.forEach((entry) => {
            const item = document.createElement("li");
            item.textContent = entry;
            this.historyList.appendChild(item);
          });
        }

        _formatExpression(tokens) {
          if (!tokens.length) return "";
          const pretty = {
            "*": "×",
            "/": "÷",
            "^": "^",
            pi: "π",
            sqrt: "√",
            log: "log10",
            log2: "log2",
            ln: "ln",
            recip: "1/x",
            abs: "abs",
          };
          let output = "";
          tokens.forEach((token) => {
            if (["+", "-", "*", "/", "^"].includes(token)) {
              output += ` ${pretty[token] || token} `;
              return;
            }
            if (token === "(" || token === ")") {
              output += token;
              return;
            }
            if (
              ["sin", "cos", "tan", "log", "ln", "log2", "recip", "abs"].includes(
                token
              )
            ) {
              output += pretty[token] || token;
              return;
            }
            output += pretty[token] || token;
          });
          return output.replace(/\s+/g, " ").trim();
        }

        render() {
          const tokens = this.engine.getTokensWithCurrent();
          const expressionTokens = this.engine.justEvaluated
            ? this.lastExpressionTokens
            : tokens;
          this.expressionEl.textContent = this._formatExpression(expressionTokens);
          this.resultEl.textContent = this.engine.getDisplayValue();
          if (!this.history.length) {
            this._renderHistory();
          }
        }
      }

      // Assign unique cyberpunk PNG characters via RoboHash (web library)
      const buttonImageBase = "https://robohash.org/";
      const buttonImageParams = "?set=set1&size=240x240";
      const buttons = document.querySelectorAll(".key");
      buttons.forEach((btn, index) => {
        const label = btn.textContent.trim();
        if (!label) return;
        const seed = encodeURIComponent(`cyberpunk-${label}-${index}`);
        const url = `${buttonImageBase}${seed}.png${buttonImageParams}`;
        btn.style.setProperty("--key-img", `url('${url}')`);
      });

      new CalculatorUI(document.getElementById("calcApp"));
    </script>
  </body>
</html>
